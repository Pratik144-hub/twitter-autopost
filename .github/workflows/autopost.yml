name: Autonomous Twitter Post

on:
  schedule:
    # Runs every 15 minutes around the clock
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual click to test from GitHub UI

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests requests-oauthlib

      - name: Run Cloud Autopost Gate
        env:
          TZ: "Asia/Kolkata"
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY || secrets.API_KEY || secrets.CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET || secrets.API_KEY_SECRET || secrets.CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET || secrets.ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/cloud_autopost.py

      - name: Commit and push updated plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): record posted slot [skip ci]"
            git push
          fi
